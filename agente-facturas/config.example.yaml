# Copia este archivo como config.yaml y ajústalo. config.yaml NO se sube a git.

empresa:
  nombre: "Mi Empresa S.A."
  cedula: "3101000000"          # cédula jurídica receptora: facturas a otro receptor van a "Revisar"

m365:
  tenant_id: "00000000-0000-0000-0000-000000000000"   # Entra ID → Información general
  client_id: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"   # App registrada (cliente público, sin secreto)
  buzon: ""                     # vacío = tu buzón; o "facturas@miempresa.cr" si es buzón compartido
  carpeta: "Facturas"           # única carpeta que se lee
  remitentes_permitidos: []     # ej.: ["proveedor1.cr", "facturacion.com"]; vacío = todos los de la carpeta
  tamano_max_mb: 10

procesamiento:
  tolerancia_cuadre: 1.00       # colones de tolerancia al validar subtotal + IVA = total
  exigir_proveedor_en_maestro: true   # proveedor nuevo → "Revisar" (control antifraude)

banco:
  moneda_cuenta: "CRC"          # una cuenta = una moneda; para la cuenta en USD usa otro config o --extracto
  hoja: ""                      # vacío = primera hoja del .xlsx
  columnas:                     # nombres EXACTOS de los encabezados de tu banco (mayúsculas/tildes no importan)
    fecha: "Fecha"
    descripcion: "Descripción"
    referencia: "Referencia"
    debito: "Débito"
    credito: "Crédito"
    monto: ""                   # úsalo SOLO si tu banco trae una sola columna con signo (+/-)
  tolerancia_monto: 1.00        # diferencia aceptada (comisiones/redondeos)
  ventana_dias: 60              # días después del vencimiento en que puede aparecer el pago
  umbral_confianza: 70          # ≥ umbral = conciliado; menor = "Sugerido" para revisión humana
